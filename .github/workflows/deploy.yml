name: Deploy notebook

on:
  schedule:
    - cron: '0 21 * * *'  # daily, 9pm utc
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    uses: data-desk-eco/workflows/.github/workflows/notebook-deploy.yml@main
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit
